name: uvg266_tests

on:
  push:
  pull_request:
    types: [closed]

jobs:
  basic-test:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v2
    - name: configure
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=RelWithDebInfo
    - name: build
      run: cmake --build build --parallel
    - name: install
      run: cmake --install build --prefix "${PWD}"
    - name: test
      run: export PATH="/home/docker/bin:${PATH}" && ctest --test-dir build --parallel --timeout 1800 --output-on-failure

  test-ubsan:
    runs-on: self-hosted
    env:
      CC: gcc
      CFLAGS: -fsanitize=undefined -fno-sanitize-recover=all -fno-sanitize=alignment

    steps:
    - uses: actions/checkout@v2
    - name: configure
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=RelWithDebInfo
    - name: build
      run: cmake --build build --parallel
    - name: install
      run: cmake --install build --prefix "${PWD}"
    - name: test
      run: export PATH="/home/docker/bin:${PATH}" && ctest --test-dir build --parallel --timeout 1800 --output-on-failure

  test-asan:
    runs-on: self-hosted
    env:
      CC: gcc
      CFLAGS: -fsanitize=address
      ASAN_OPTIONS: detect_leaks=0
      # AddressSanitizer adds some extra symbols so we expect a failure from
      # the external symbols test.
      XFAIL_TESTS: test_external_symbols

    steps:
    - uses: actions/checkout@v2
    - name: configure
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=RelWithDebInfo
    - name: build
      run: cmake --build build --parallel
    - name: install
      run: cmake --install build --prefix "${PWD}"
    - name: test
      run: export PATH="/home/docker/bin:${PATH}" && ctest --test-dir build --parallel --timeout 1800 --output-on-failure

  # test-tsan:
    # runs-on: self-hosted
    # env:
      # CC: gcc
      # CFLAGS: -fsanitize=thread

    # steps:
    # - uses: actions/checkout@v2
    - name: configure
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=RelWithDebInfo
    - name: build
      run: cmake --build build --parallel
    - name: install
      run: cmake --install build --prefix "${PWD}"
    - name: test
      run: export PATH="/home/docker/bin:${PATH}" && ctest --test-dir build --parallel --timeout 1800 --output-on-failure

  test-valgrind:
    runs-on: self-hosted

    env:
      UVG266_OVERRIDE_angular_pred: generic

    steps:
    - uses: actions/checkout@v2
    - name: configure
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=RelWithDebInfo
    - name: build
      run: cmake --build build --parallel
    - name: install
      run: cmake --install build --prefix "${PWD}"
    - name: test
      run: export PATH="/home/docker/bin:${PATH}" && ctest --test-dir build --parallel --timeout 7200 --output-on-failure
